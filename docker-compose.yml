# Üretim yığını (AWS EC2).
#   docker compose up -d
#
# Veritabanı ve logo önbelleği imaja gömülmez; sunucudaki dizinlerden bağlanır.
#
# Backend imajı artık sunucuda değil CI'da derleniyor ve GHCR'a commit
# SHA'sıyla etiketlenerek itiliyor. Böylece prod'un CPU'su derlemeye gitmiyor
# ve her sürüm geri dönülebilir bir artefakt oluyor:
#   BACKEND_IMAGE=ghcr.io/bahribirer/footttball-backend:<sha> docker compose up -d
# .env dosyasındaki BACKEND_IMAGE değeri o an ayakta olan sürümü tutar.

services:
  backend:
    # Yerelde derlemek için: docker compose build backend
    build:
      context: ./backend
    image: ${BACKEND_IMAGE:-ghcr.io/bahribirer/footttball-backend:latest}
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DB_PATH: /app/data/tikitakapi.db
      LOGO_DIR: /app/static/logos
      # Hata raporlama: DSN verilmezse sessizce kapalı kalır.
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Hataları dağıtılan sürümle eşleştirmek için.
      RELEASE: ${BACKEND_IMAGE:-dev}
      # Bozulan bir modu yeni uygulama sürümü beklemeden kapatmak için:
      # virgülle ayrılmış mod kimlikleri, örn. "last_letter,category_race"
      MODES_DISABLED: ${MODES_DISABLED:-}
      # Verilirse oda durumu Redis'te paylaşılır ve birden fazla
      # backend süreci çalıştırılabilir. Boşsa tek süreç + disk
      # anlık görüntüsü ile çalışılır.
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      # Yazılabilir bağlanıyor ama uygulama bağlantıları `mode=ro`: WAL
      # modunda SQLite okurken bile -shm dosyasını açabilmek zorunda, salt
      # okunur bağlamada "attempt to write a readonly database" veriyor.
      # Yazma yasağı bağlama yerine bağlantı seviyesinde (db/database.py).
      - ./backend/data:/app/data
      - logo_cache:/app/static/logos
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ping', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Çok süreçli çalışma için paylaşılan oda durumu.
  #
  # `profiles` arkasında: tek backend süreciyle çalışan kurulumda gereksiz.
  # Açmak için:  docker compose --profile scale up -d
  # ve REDIS_URL=redis://redis:6379/0
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: [scale]
    # 1.9 GB'lik makinede Redis'in belleği yemesi engellenir; oda durumu
    # küçük, 64 MB fazlasıyla yeter.
    command: >
      redis-server --save "" --appendonly no
      --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - edge

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/certbot/conf:/etc/letsencrypt:ro
      - ./infra/certbot/www:/var/www/certbot
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Sertifika yenileme: 12 saatte bir dener, nginx'i yeniden yükler.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!}; done"

volumes:
  logo_cache:

networks:
  edge:
    driver: bridge
