# Geliştirme yığını: TLS ve nginx olmadan, kod değişince otomatik yeniden yükleme.
#   docker compose -f docker-compose.dev.yml up --build
# Uygulama: http://localhost:8000  (Android emülatöründen: http://10.0.2.2:8000)

services:
  backend:
    build:
      context: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DB_PATH: /app/data/tikitakapi.db
      LOGO_DIR: /app/static/logos
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
      - ./backend/static/logos:/app/static/logos
