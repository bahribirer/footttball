# Her itme ve PR'da çalışan doğrulama.
#
# Üç iş birbirinden bağımsız koşar: backend testleri, Flutter statik analizi
# ve widget testleri. Cihaz gerektiren integration_test paketi burada değil;
# emülatör maliyeti nedeniyle sürüm iş akışında çalışır.

name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend testleri
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      # Testler oyuncu veritabanına dokunmayan katmanları kapsıyor; yine de
      # app.main içe aktarılırken DB yolu çözülebilmeli.
      - name: Boş veritabanı iskeleti
        run: |
          mkdir -p data
          [ -f data/tikitakapi.db ] || python - <<'PY'
          import sqlite3
          con = sqlite3.connect("data/tikitakapi.db")
          con.execute("""CREATE TABLE IF NOT EXISTS players (
              name TEXT, name_normalized TEXT, country_of_citizenship TEXT,
              current_club_name TEXT, image_url TEXT, last_season INTEGER,
              market_value_in_eur TEXT, highest_market_value_in_eur TEXT,
              position TEXT, sub_position TEXT, current_club_domestic_competition_id TEXT)""")
          con.commit()
          PY

      - name: pytest
        run: python -m pytest tests/ -q

  scripts:
    name: Altyapı betikleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sözdizimi
        run: |
          for f in infra/*.sh know-how/*.sh know-how/templates/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" && echo "ok  $f"
          done

      # deploy.sh bir kez `.env` yokken tek satır çıktı vermeden ölmüştü;
      # `set -euo pipefail` altında grep'in sıfırdan farklı dönmesi yetiyor.
      - name: deploy.sh erken çıkmıyor
        run: ./infra/test_deploy_sh.sh

      # Servis tanımları paketlere compose'dan türetiliyor; bölücü bozulursa
      # paket sessizce eksik tanımla çıkardı.
      - name: Sürüm paketi bölücüsü
        run: |
          python3 -m pip install --quiet --break-system-packages pyyaml
          python3 know-how/templates/split_compose.py docker-compose.yml /tmp/split
          test -s /tmp/split/_base.yml || { echo "eksik: _base.yml"; exit 1; }
          test -s /tmp/split/bind_defaults.env || { echo "eksik: bind_defaults.env"; exit 1; }
          for f in backend nginx redis certbot; do
            test -s "/tmp/split/$f.yml" || { echo "eksik: $f.yml"; exit 1; }
          done
          # Üçüncü parti imajlar değişkenleştirilmeli, yoksa version.env'deki
          # sürüm etiketi hiç kullanılmaz.
          grep -q 'NGINX_IMAGE' /tmp/split/nginx.yml || { echo "nginx imajı değişkenleşmemiş"; exit 1; }
          # Bind yolları da değişkenleşmeli; sabit kalırsa hedef makinede
          # dizin taşınamaz.
          grep -q 'INFRA_CERTBOT_CONF_DIR' /tmp/split/nginx.yml || { echo "bind yolu değişkenleşmemiş"; exit 1; }
          echo "✓ bölücü doğru çalışıyor"

  flutter:
    name: Flutter analiz + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.1"
          channel: stable
          cache: true

      - name: Paketler
        run: flutter pub get

      - name: Biçim denetimi
        run: dart format --output=none --set-exit-if-changed lib/ test/

      # Mevcut kodda withOpacity uyarıları var; yalnızca error seviyesi bloklar.
      - name: Analiz
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Widget testleri
        run: flutter test test/

  integration:
    name: Integration testleri (iOS simülatörü)
    # Simülatör gerektirdiği için macOS koşucusu. Yalnızca main ve PR'larda
    # koşar, her feature itmesinde değil — süresi uzun.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.1"
          channel: stable
          cache: true

      - name: Paketler
        run: flutter pub get

      - name: Simülatörü başlat
        run: |
          # Kurulu en yeni iPhone seçilir; runner imajı değişse de çalışır.
          DEVICE=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [^(]*\([0-9A-F-]{36}\)' \
            | tail -1 \
            | grep -oE '[0-9A-F-]{36}')
          if [ -z "$DEVICE" ]; then
            echo "Kullanilabilir iPhone simulatoru bulunamadi"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

      # Yalnızca davranış testleri koşar. integration_test altındaki
      # *_visual_test.dart dosyaları ekran görüntüsü alınabilsin diye ekranı
      # saniyelerce açık tutan yerel inceleme araçları; otomatik doğrulama
      # yapmıyorlar ve CI'da 12 dakikalık zaman aşımına takılıyorlar.
      #
      # Dosyalar tek tek koşar ve başarısız olan bir kez tekrarlanır. Bu
      # testler canlı sunucuya konuşuyor ve paylaşılan koşucuda simülatörün
      # uygulamayı başlatamadığı, hiç çıktı vermeden 12 dakika asıldığı
      # görüldü — aynı testler yerelde, temiz simülatörde geçiyor. Tek
      # dosyanın takılması diğerlerini götürmesin diye ayrıldılar.
      - name: Integration testleri
        run: |
          set -u
          FAILED=""
          for f in game_flow_test tiki_taka_toe_test suggestion_test; do
            echo "::group::$f"
            if flutter test "integration_test/$f.dart" -d "$DEVICE" --timeout 90s; then
              echo "✓ $f"
            else
              echo "↻ $f tekrar deneniyor"
              xcrun simctl terminate "$DEVICE" com.bahribirer.footttball 2>/dev/null || true
              if flutter test "integration_test/$f.dart" -d "$DEVICE" --timeout 90s; then
                echo "✓ $f (ikinci denemede)"
              else
                FAILED="$FAILED $f"
              fi
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "Basarisiz:$FAILED"
            exit 1
          fi
