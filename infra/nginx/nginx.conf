user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Sürüm bilgisi sızdırılmaz.
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # --- İstek hızı sınırları -------------------------------------------
    # API: dakikada ~600 istek/IP; arama uçları için ayrı, daha sıkı bölge.
    limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=10r/s;
    limit_req_zone $binary_remote_addr zone=search_zone:10m rate=4r/s;
    limit_req_zone $binary_remote_addr zone=ws_zone:10m     rate=1r/s;
    # Eş zamanlı bağlantı sınırı (WebSocket kötüye kullanımını sınırlar).
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    limit_req_status 429;
    limit_conn_status 429;

    # WebSocket upgrade başlığı için harita: normal isteklerde "close" gönderir.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Kulüp logoları için disk önbelleği (yalnızca logo konumunda kullanılır).
    proxy_cache_path /var/cache/nginx/logos levels=1:2 keys_zone=logo_cache:10m
                     max_size=200m inactive=30d use_temp_path=off;

    upstream backend_app {
        server backend:8000;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
