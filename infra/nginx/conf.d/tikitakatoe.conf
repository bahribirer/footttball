# Tiki Taka Toe — ters vekil yapılandırması
#
# Trafik üç ayrı yola bölünür:
#   /api/    -> REST uçları (hız sınırlı)
#   /ws/     -> WebSocket (upgrade + uzun zaman aşımı)
#   /health  -> yalnızca özel ağdan erişilebilir sağlık kontrolü

# --- Ortak vekil başlıkları ---------------------------------------------
proxy_http_version 1.1;

server {
    listen 80;
    listen [::]:80;
    server_name tikitakatoe.com www.tikitakatoe.com;

    # Let's Encrypt doğrulaması HTTP üzerinden kalmalı.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tikitakatoe.com www.tikitakatoe.com;

    ssl_certificate     /etc/letsencrypt/live/tikitakatoe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tikitakatoe.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Güvenlik başlıkları --------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Eş zamanlı bağlantı sınırı
    limit_conn conn_zone 20;

    # --- WebSocket -------------------------------------------------------
    location /ws/ {
        limit_req zone=ws_zone burst=10 nodelay;

        proxy_pass http://backend_app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Oyun oturumları uzun sürer; erken kopmayı önle.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # --- Oyuncu araması: en pahalı uç, ayrı sınır ------------------------
    location /api/v1/get_player_names {
        limit_req zone=search_zone burst=8 nodelay;

        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- Kulüp logoları: uzun süreli önbellek ----------------------------
    location /api/v1/logo_image/ {
        limit_req zone=api_zone burst=40 nodelay;

        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        proxy_cache logo_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # --- REST API --------------------------------------------------------
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;

        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Eski istemcilerin kullandığı uçlar ------------------------------
    location = /check_room {
        return 404;
    }

    location /check_room/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ping {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Sağlık kontrolü: yalnızca özel ağ -------------------------------
    location = /health {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- API dokümanı üretimde kapalı ------------------------------------
    location ~ ^/(docs|redoc|openapi\.json) {
        deny all;
    }

    location / {
        return 404;
    }
}
