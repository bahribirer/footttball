# ÜRETİLMİŞ DOSYA — elle düzenlemeyin.
# Kaynak: docker-compose.yml, know-how/build_release.sh tarafından bölündü.
services:
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    profiles:
    - scale
    command: 'redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy
      allkeys-lru

      '
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
    - edge
