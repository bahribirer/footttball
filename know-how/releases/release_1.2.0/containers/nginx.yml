# ÜRETİLMİŞ DOSYA — elle düzenlemeyin.
# Kaynak: docker-compose.yml, know-how/build_release.sh tarafından bölündü.
services:
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
    - ${HTTP_PORT:-80}:80
    - ${HTTPS_PORT:-443}:443
    volumes:
    - ${INFRA_NGINX_CONF_FILE:-./infra/nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
    - ${INFRA_NGINX_CONFD_DIR:-./infra/nginx/conf.d}:/etc/nginx/conf.d:ro
    - ${INFRA_CERTBOT_CONF_DIR:-./infra/certbot/conf}:/etc/letsencrypt:ro
    - ${INFRA_CERTBOT_WWW_DIR:-./infra/certbot/www}:/var/www/certbot
    networks:
    - edge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
